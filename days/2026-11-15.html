<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstimmung 29. November: Was die erste SRG-Umfrage zeigt</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  body{margin:0;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:transparent;color:inherit}
  h1{font-size:1.4rem;margin:0 0 8px}
  p.lead{margin:0 0 12px;line-height:1.45}
  .src,.fb{font-size:.8rem;opacity:.8;margin-top:10px;line-height:1.4}
  a{color:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, Legend, LabelList, CartesianGrid } = Recharts;

// Source: SRF / SRG-Trendumfrage gfs.bern, 5.-18. Oktober 2026 (Ja / Nein / weiss nicht, in %)
const data = [
  { name: "Feuerwerksinitiative", ja: 69, nein: 29, unent: 2 },
  { name: "Initiative gegen Heiratsstrafe", ja: 55, nein: 34, unent: 11 },
  { name: "Kriegsmaterialgesetz", ja: 49, nein: 41, unent: 10 },
  { name: "Finanzierung 13. AHV-Rente", ja: 46, nein: 49, unent: 5 },
];
const C = { ja: "#2a7ab0", nein: "#d9822b", unent: "#9a9a9a" };

function App() {
  const fallback = data.map(d => `${d.name}: ${d.ja} % Ja, ${d.nein} % Nein, ${d.unent} % unentschieden`).join("; ");
  return (
    <div>
      <h1>Abstimmung vom 29. November: Nur die AHV-Finanzierung liegt im Nein</h1>
      <p className="lead">In der ersten SRG-Umfrage von gfs.bern führt die Feuerwerksinitiative klar. Bei der Finanzierung der 13. AHV-Rente liegt das Nein knapp vorn, das liegt aber innerhalb der Fehlermarge von ±2,8 Prozentpunkten.</p>
      <div role="img" aria-label={"Gestapeltes Balkendiagramm der ersten SRG-Umfrage zu vier Vorlagen vom 29. November 2026. " + fallback}>
        <ResponsiveContainer width="100%" height={320}>
          <BarChart data={data} layout="vertical" stackOffset="expand" margin={{ top: 8, right: 16, left: 8, bottom: 8 }}>
            <CartesianGrid horizontal={false} strokeOpacity={0.25} />
            <XAxis type="number" tickFormatter={v => Math.round(v * 100) + " %"} />
            <YAxis type="category" dataKey="name" width={150} tick={{ fill: "currentColor", fontSize: 13 }} />
            <Tooltip formatter={(v) => v + " %"} />
            <Legend />
            <Bar dataKey="ja" name="Ja" stackId="a" fill={C.ja}><LabelList dataKey="ja" position="center" fill="#fff" formatter={v => v + " %"} /></Bar>
            <Bar dataKey="unent" name="Unentschieden" stackId="a" fill={C.unent}><LabelList dataKey="unent" position="center" fill="#000" formatter={v => v >= 5 ? v + " %" : ""} /></Bar>
            <Bar dataKey="nein" name="Nein" stackId="a" fill={C.nein}><LabelList dataKey="nein" position="center" fill="#000" formatter={v => v + " %"} /></Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="fb">Zahlen: {fallback}.</div>
      <div className="src">Befragung 5.–18. Oktober 2026, 14&nbsp;874 Stimmberechtigte, Fehlermarge ±2,8 Prozentpunkte; «Ja»/«Nein» inklusive «eher». Die zweite Welle erscheint am 18. November. Quelle: SRG-Trendumfrage gfs.bern via SRF: <a href="https://www.srf.ch/news/erste-srg-umfrage-ja-vorteil-fuer-feuerwerksinitiative-meinungen-fast-gemacht" target="_blank" rel="noopener">Feuerwerk</a>, <a href="https://www.srf.ch/news/erste-srg-umfrage-knappes-ja-bei-der-initiative-gegen-die-heiratsstrafe" target="_blank" rel="noopener">Heiratsstrafe</a>, <a href="https://www.srf.ch/news/erste-srg-umfrage-beim-kriegsmaterialgesetz-ist-noch-alles-offen" target="_blank" rel="noopener">Kriegsmaterial</a>, <a href="https://www.srf.ch/news/erste-srg-umfrage-finanzierung-13-ahv-pattsituation-mit-leichtem-nein-vorsprung" target="_blank" rel="noopener">AHV</a>. Stand: 15.11.2026.</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
