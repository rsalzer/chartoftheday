<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Hitzewochen treiben Sterblichkeit der über 65-Jährigen nach oben</title>
	<style>
		:root {
			--ink: #17160f; --muted: #6c6b63; --hair: #e3e1d7; --card: #ffffff;
			--base: #8b8a80; --heat: #c0472a; --zero: #b9b7ab;
			--serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
			--sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--ink: #f0eee4; --muted: #9a988d; --hair: #2a2924; --card: #1b1b16;
				--base: #6f6e66; --heat: #e0704f; --zero: #4a4940;
			}
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
		#root { padding: 14px 16px 18px; }
		.cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
		.kpi { flex: 1 1 150px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
		.kpi .lab { font-size: 12px; color: var(--muted); }
		.kpi .val { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
		.kpi .val small { font-size: 13px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
		.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); margin: 2px 2px 10px; }
		.legend span { display: inline-flex; align-items: center; gap: 6px; }
		.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
		.note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; line-height: 1.5; }
		.fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
	</style>
</head>
<body>
<div id="root">
	<p class="fallback">Wöchentliche Todesfälle von über 65-Jährigen in der Schweiz, 2026, im Vergleich zum Mittel 2019 und 2021–2025 (BFS): In den Hitzewochen vom 22. Juni und 29. Juni lagen die Todesfälle 12,4% resp. 9,7% über dem Mittel, in den Wochen davor zwischen -4,8% und +6,1%.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
	/** @jsx React.createElement */
	/** @jsxFrag React.Fragment */
	const { BarChart, Bar, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ResponsiveContainer } = Recharts;
	
	// Wöchentliche Todesfälle, Altersgruppe 65+ (65-79 plus 80 und mehr Jahre),
	// Schweiz. Quelle: BFS, "Todesfälle nach Altersklasse, Woche und Kanton"
	// (provisorische 2026-Zahlen, Stand 21.07.2026). Vergleichswert = Mittel der
	// gleichen Kalenderwoche 2019 und 2021-2025 (2020 wegen Covid-19 ausgeschlossen).
	// Abweichung selbst berechnet und gegen die Rohdaten geprüft.
	const DATA = [
		{ week: 18, label: '27.4.', deaths2026: 1175, avg: 1123.5 },
		{ week: 19, label: '4.5.',  deaths2026: 1104, avg: 1087.5 },
		{ week: 20, label: '11.5.', deaths2026: 1120, avg: 1074.7 },
		{ week: 21, label: '18.5.', deaths2026: 1154, avg: 1088.0 },
		{ week: 22, label: '25.5.', deaths2026: 1126, avg: 1077.3 },
		{ week: 23, label: '1.6.',  deaths2026: 1026, avg: 1058.5 },
		{ week: 24, label: '8.6.',  deaths2026: 1025, avg: 1077.2 },
		{ week: 25, label: '15.6.', deaths2026: 1109, avg: 1076.8 },
		{ week: 26, label: '22.6.', deaths2026: 1240, avg: 1103.0, heat: true },
		{ week: 27, label: '29.6.', deaths2026: 1189, avg: 1084.2, heat: true }
	].map((d) => ({ ...d, pct: Math.round(((d.deaths2026 - d.avg) / d.avg) * 1000) / 10 }));
	
	const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
	const axis = isDark ? '#9a988d' : '#6c6b63';
	const grid = isDark ? '#2c2c2a' : '#e3e1d7';
	
	function ChartTip({ active, payload }) {
		if (!active || !payload || !payload.length) return null;
		const row = payload[0].payload;
		return (
			<div style={{ background: isDark ? '#20201a' : '#fff', border: '1px solid ' + grid,
				borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: isDark ? '#f0eee4' : '#17160f' }}>
				<div style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>Woche ab {row.label}</div>
				<div style={{ color: axis }}>{row.deaths2026} Todesfälle ({row.pct > 0 ? '+' : ''}{row.pct.toFixed(1).replace('.', ',')}% vs. Mittel)</div>
			</div>
		);
	}
	
	function App() {
		return (
			<div>
				<div className="cards">
					<div className="kpi"><div className="lab">Woche ab 22. Juni</div><div className="val">+12,4 <small>%</small></div></div>
					<div className="kpi"><div className="lab">Woche ab 29. Juni</div><div className="val">+9,7 <small>%</small></div></div>
					<div className="kpi"><div className="lab">Wochen davor</div><div className="val">-4,8 … +6,1 <small>%</small></div></div>
				</div>
				<div className="legend">
					<span><span className="swatch" style={{ background: 'var(--heat)' }}></span>Hitzewochen (Ende Juni / Anfang Juli)</span>
					<span><span className="swatch" style={{ background: 'var(--base)' }}></span>übrige Wochen seit Ende April</span>
				</div>
				<div role="img" aria-label="Balkendiagramm: Abweichung der wöchentlichen Todesfälle von über 65-Jährigen in der Schweiz 2026 vom Sechsjahresmittel, Ende April bis Anfang Juli. In den beiden Hitzewochen liegt die Abweichung bei plus 12,4 und plus 9,7 Prozent, in den Wochen davor zwischen minus 4,8 und plus 6,1 Prozent.">
					<ResponsiveContainer width="100%" height={300}>
						<BarChart data={DATA} margin={{ top: 8, right: 12, bottom: 4, left: -8 }}>
							<CartesianGrid stroke={grid} vertical={false} />
							<XAxis dataKey="label" tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
							<YAxis tick={{ fill: axis, fontSize: 12 }} stroke={grid}
							       tickFormatter={(v) => (v > 0 ? '+' : '') + v + '%'} width={54} />
							<ReferenceLine y={0} stroke="var(--zero)" />
							<Tooltip content={<ChartTip />} cursor={{ fill: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)' }} />
							<Bar dataKey="pct" radius={[3, 3, 3, 3]} isAnimationActive={false}>
								{DATA.map((d, i) => <Cell key={i} fill={d.heat ? 'var(--heat)' : 'var(--base)'} />)}
							</Bar>
						</BarChart>
					</ResponsiveContainer>
				</div>
				<p className="note">
					Abweichung der Todesfälle bei über 65-Jährigen vom Mittel derselben Kalenderwoche 2019 und 2021–2025
					(2020 wegen Covid-19-Sondereffekt ausgeschlossen). Wochen nach ISO 8601, Datum = Wochenbeginn.
					Die jüngsten BFS-Wochenwerte sind wegen der Melde­verzögerung bei Todesfällen provisorisch und
					werden erfahrungsgemäss nach oben korrigiert.
				</p>
			</div>
		);
	}
	
	ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	
	// Report height to the gallery so the surrounding iframe fits exactly.
	function postHeight() {
		const h = document.documentElement.scrollHeight;
		if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
	}
	requestAnimationFrame(() => setTimeout(postHeight, 120));
	window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
