<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstimmung 29. November: Feuerwerksverbot vorne, AHV-Finanzierung knapp im Nein</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: transparent; color: inherit; }
  h1 { font-size: 1.4rem; line-height: 1.25; margin: 0 0 8px; }
  p.lead { margin: 0 0 12px; font-size: 1rem; line-height: 1.45; }
  p.fallback { font-size: .85rem; opacity: .85; margin: 8px 0; }
  p.source { font-size: .8rem; opacity: .85; margin: 8px 0 0; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { ScatterChart, Scatter, XAxis, YAxis, ReferenceLine, Tooltip, Legend, ResponsiveContainer, CartesianGrid } = Recharts;

// Source: gfs.bern, 1. SRG-Trendumfrage, Feldzeit 5.-18.10.2026, n=14'874, Fehlerbereich ±2,8 Pp.
const DATA = [
  { name: "AHV-Zusatzfinanzierung (MWST)", ja: 46, nein: 49, weissnicht: 5 },
  { name: "Feuerwerksinitiative", ja: 69, nein: 29, weissnicht: 2 },
  { name: "Fairness-Initiative (Ehepaare)", ja: 55, nein: 34, weissnicht: 11 },
  { name: "Kriegsmaterialgesetz", ja: 49, nein: 41, weissnicht: 10 },
];
const JA = "#1f77b4", NEIN = "#d95f02";
const ja = DATA.map(d => ({ x: d.ja, y: d.name, ...d }));
const nein = DATA.map(d => ({ x: d.nein, y: d.name, ...d }));

const Tip = ({ active, payload }) => {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (
    <div style={{ background: "#fff", color: "#111", padding: "6px 10px", border: "1px solid #999", borderRadius: 4, fontSize: 13 }}>
      <strong>{d.name}</strong><br />Ja: {d.ja} % · Nein: {d.nein} % · Weiss nicht: {d.weissnicht} %
    </div>
  );
};


function App() {
  const summary = DATA.map(d => `${d.name}: Ja ${d.ja} %, Nein ${d.nein} %`).join("; ");
  return (
    <div>
      <h1>Abstimmung 29. November: Feuerwerksverbot klar vorne, AHV-Finanzierung knapp im Nein</h1>
      <p className="lead">Laut der ersten SRG-Trendumfrage haben drei der vier Vorlagen eine Ja-Mehrheit; nur die Mehrwertsteuer-Finanzierung der AHV liegt mit 46 zu 49 Prozent knapp im Nein. Bei Differenzen unter 2,8 Prozentpunkten (Fehlerbereich) ist der Ausgang offen.</p>
      <div role="img" aria-label={"Punktdiagramm der Ja- und Nein-Anteile je Vorlage in der ersten SRG-Umfrage. " + summary} style={{ width: "100%", height: 340 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ScatterChart margin={{ top: 20, right: 30, bottom: 20, left: 10 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#888" strokeOpacity={0.3} />
            <XAxis type="number" dataKey="x" domain={[0, 80]} unit=" %" tick={{ fill: "currentColor", fontSize: 12 }} name="Anteil" label={{ value: "Anteil der Stimmabsichten in Prozent", position: "insideBottom", offset: -10, fill: "currentColor", fontSize: 12 }} />
            <YAxis type="category" dataKey="y" width={190} tick={{ fill: "currentColor", fontSize: 12 }} allowDuplicatedCategory={false} />
            <ReferenceLine x={50} stroke="#888" strokeDasharray="4 4" />
            {DATA.map(d => (
              <ReferenceLine key={d.name} segment={[{ x: d.nein, y: d.name }, { x: d.ja, y: d.name }]} stroke="#888" strokeWidth={3} strokeOpacity={0.6} />
            ))}
            <Tooltip content={<Tip />} />
            <Legend verticalAlign="top" />
            <Scatter name="Nein" data={nein} fill={NEIN} shape="circle" isAnimationActive={false} />
            <Scatter name="Ja" data={ja} fill={JA} shape="diamond" isAnimationActive={false} />
          </ScatterChart>
        </ResponsiveContainer>
      </div>
      <p className="fallback">Ja/Nein in Prozent: {summary}. Umfrage 5.–18. Oktober 2026, n = 14'874, Fehlerbereich ±2,8 Prozentpunkte.</p>
      <p className="source">Quelle: <a href="https://www.gfsbern.ch/en/news/1st-srg-trend-survey-on-the-federal-vote-of-29-november-2026/" target="_blank" rel="noopener">gfs.bern, 1. SRG-Trendumfrage (veröffentlicht 23.10.2026)</a>; <a href="https://cockpit.gfsbern.ch/de/cockpit/trend_w1_29112026/" target="_blank" rel="noopener">gfs.bern Cockpit</a>. Stand: 8. November 2026. Momentaufnahme, keine Prognose.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
