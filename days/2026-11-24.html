<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstimmung 29. November: Nur die Feuerwerksinitiative hat klar Rückenwind</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:transparent;color:inherit;line-height:1.4}
  h1{font-size:1.4rem;margin:0 0 8px}
  p.lead{margin:0 0 12px;font-size:1rem}
  .src{font-size:.8rem;margin-top:10px;opacity:.85}
  .src a{color:inherit}
  .fb{font-size:.85rem;margin:8px 0 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const {BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,Legend,LabelList} = Recharts;

// YouGov Schweiz, 2. Stimmungsbarometer (Feldzeit 2.-16.11.2026, n=3013, MRP-Schätzungen, Prozent).
// "rest" = 100 - ja - nein (Differenz, keine publizierte Zahl).
const data = [
  {name:"Feuerwerksinitiative", ja:59, nein:36, rest:5},
  {name:"Fairness-Initiative", ja:45, nein:42, rest:13},
  {name:"Kriegsmaterialgesetz", ja:42, nein:37, rest:21},
  {name:"AHV-Zusatzfinanzierung (MWST)", ja:39, nein:54, rest:7},
];
const CJ="#2a7ab9", CN="#d95f02", CR="#9a9a9a";
function Tip({active,payload,label}){
  if(!active||!payload||!payload.length) return null;
  return (<div style={{background:"#fff",color:"#111",border:"1px solid #ccc",padding:"6px 10px",fontSize:13}}>
    <b>{label}</b>{payload.map(p=><div key={p.dataKey}>{p.name}: {p.value} %</div>)}</div>);
}
function App(){
  return (<>
    <h1>Abstimmung 29. November: Nur die Feuerwerksinitiative hat klar Rückenwind</h1>
    <p className="lead">Laut dem letzten YouGov-Stimmungsbarometer liegt die Feuerwerksinitiative bei 59 % Ja, die AHV-Zusatzfinanzierung bei 54 % Nein. Die Fairness-Initiative fiel von 57 % Ja im Oktober auf 45 %; beim Kriegsmaterialgesetz ist das Rennen offen.</p>
    <div role="img" aria-label="Gestapeltes Balkendiagramm: Stimmabsichten für die vier eidgenössischen Vorlagen vom 29. November 2026 in Prozent. Feuerwerksinitiative 59 Ja, 36 Nein; Fairness-Initiative 45 Ja, 42 Nein; Kriegsmaterialgesetz 42 Ja, 37 Nein; AHV-Zusatzfinanzierung 39 Ja, 54 Nein." style={{width:"100%",height:300}}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={data} layout="vertical" margin={{top:10,right:20,left:10,bottom:10}}>
          <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.2} horizontal={false}/>
          <XAxis type="number" domain={[0,100]} tick={{fill:"currentColor",fontSize:11}} unit=" %"/>
          <YAxis type="category" dataKey="name" width={150} tick={{fill:"currentColor",fontSize:12}}/>
          <Tooltip content={<Tip/>} cursor={{fill:"rgba(128,128,128,0.15)"}}/>
          <Legend/>
          <Bar dataKey="ja" name="Ja" stackId="a" fill={CJ}><LabelList dataKey="ja" fill="#fff" fontSize={12}/></Bar>
          <Bar dataKey="nein" name="Nein" stackId="a" fill={CN}><LabelList dataKey="nein" fill="#fff" fontSize={12}/></Bar>
          <Bar dataKey="rest" name="Unentschieden/Rest" stackId="a" fill={CR}/>
        </BarChart>
      </ResponsiveContainer>
    </div>
    <p className="fb">Kennzahlen (Ja/Nein in %): Feuerwerk 59/36, Fairness 45/42, Kriegsmaterial 42/37, AHV-Finanzierung 39/54. «Unentschieden/Rest» ist die Differenz zu 100 %, nicht separat publiziert (ausser Feuerwerk 5 %, Fairness 13 %). MRP-Schätzungen, Fehlerbereich ±1,8 %, n = 3013, Befragung 2.–16.11.2026.</p>
    <p className="src">Quelle: <a href="https://yougov.com/de-de/artikel/56001-fairness-initiative-bricht-ein-kriegsmaterialgesetz-bleibt-offen-wie-will-die-schweiz-am-29-november-abstimmen" target="_blank" rel="noopener">YouGov Schweiz, zweites Stimmungsbarometer vom 17.11.2026</a>. Umfragen sind keine Prognosen. Stand: 24.11.2026.</p>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
