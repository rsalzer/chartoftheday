<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Österreich: Inflation steigt im September auf 3,6 Prozent</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: transparent; font-family: system-ui, sans-serif; color: CanvasText; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; line-height: 1.25; }
  p.lead { margin: 0 0 16px; line-height: 1.45; }
  .src { font-size: 0.8rem; margin-top: 12px; opacity: 0.8; }
  .fb { font-size: 0.85rem; margin-top: 8px; }
  a { color: #2a78c8; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot, LabelList } = Recharts;

// Statistik Austria, Inflationsrate (VPI) gegenüber Vorjahresmonat in %. September = Schnellschätzung.
const data = [
  { m: "Jan", v: 2.0 }, { m: "Feb", v: 2.2 }, { m: "Mär", v: 3.2 },
  { m: "Apr", v: 3.4 }, { m: "Mai", v: 3.7 }, { m: "Jun", v: 3.2 },
  { m: "Jul", v: 2.8 }, { m: "Aug", v: 3.2 }, { m: "Sep*", v: 3.6 },
];
const fmt = (v) => v.toFixed(1).replace(".", ",") + " %";

function App() {
  return (
    <div>
      <h1>Österreich: Inflation steigt im September auf 3,6 Prozent</h1>
      <p className="lead">Nach 3,2 Prozent im August liegt die Teuerung laut Schnellschätzung von Statistik Austria so hoch wie zuletzt im Mai (3,7 Prozent). Seit Jahresbeginn hat sie sich fast verdoppelt – im Januar betrug sie 2,0 Prozent.</p>
      <div role="img" aria-label="Liniendiagramm der monatlichen Inflationsrate in Österreich von Januar bis September 2026: von 2,0 Prozent im Januar über 3,7 Prozent im Mai auf 3,6 Prozent im September (Schnellschätzung)." style={{ height: 340 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={data} margin={{ top: 24, right: 20, bottom: 8, left: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.15} />
            <XAxis dataKey="m" tick={{ fill: "currentColor", fontSize: 12 }} />
            <YAxis domain={[0, 4]} tickFormatter={(v) => v + " %"} tick={{ fill: "currentColor", fontSize: 12 }} width={48} />
            <Tooltip formatter={(v) => [fmt(v), "Inflationsrate"]} />
            <Line type="monotone" dataKey="v" stroke="#2a78c8" strokeWidth={3} dot={{ r: 4 }} isAnimationActive={false}>
              <LabelList dataKey="v" position="top" formatter={fmt} fill="currentColor" fontSize={11} />
            </Line>
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="fb">Kernzahlen: Januar 2,0 %, Mai 3,7 % (Höchstwert), Juli 2,8 %, August 3,2 %, September 3,6 % (Schnellschätzung).</div>
      <div className="src">Inflationsrate gegenüber dem Vorjahresmonat (VPI). *September: Schnellschätzung, Endwert folgt. Quelle: <a href="https://www.statistik.at/medien/pressemitteilungen" target="_blank" rel="noopener">Statistik Austria</a>, <a href="https://www.statistik.at/fileadmin/announcement/2026/10/20261002VPIFlashEstimateSeptember2026.pdf" target="_blank" rel="noopener">Schnellschätzung vom 2.10.2026</a>. Stand: 12.10.2026.</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
