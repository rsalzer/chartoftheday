<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masern in den USA: 2026 schon mehr als doppelt so viele Fälle wie 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:transparent;color:inherit}
  h1{font-size:1.4rem;margin:0 0 8px;line-height:1.25}
  p{margin:0 0 12px;line-height:1.45}
  .src{font-size:.8rem;opacity:.8;margin-top:8px}
  .src a{color:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Cell, LabelList } = Recharts;
const data = [
  { year: "2019", cases: 1274 },
  { year: "2020", cases: 13 },
  { year: "2021", cases: 49 },
  { year: "2022", cases: 121 },
  { year: "2023", cases: 59 },
  { year: "2024", cases: 285 },
  { year: "2025", cases: 2289 },
  { year: "2026", cases: 4852 },
];
const fmt = (n) => n.toLocaleString("de-CH").replace(/,/g, "'");
const App = () => (
  <div>
    <h1>Masern in den USA: 2026 schon mehr als doppelt so viele Fälle wie 2025</h1>
    <p>Bis zum 29. Oktober 2026 meldet die US-Gesundheitsbehörde CDC 4'852 bestätigte Masernfälle, nach 2'289 im ganzen Jahr 2025. Die Zahlen für 2025 und 2026 sind vorläufig.</p>
    <div role="img" aria-label="Säulendiagramm: Bestätigte Masernfälle in den USA pro Jahr 2019 bis 2026. 2026 mit 4852 Fällen bis 29. Oktober höchster Wert, 2025 mit 2289, 2019 mit 1274." style={{ width: "100%", height: 340 }}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={data} margin={{ top: 20, right: 10, left: 0, bottom: 5 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.2} vertical={false} />
          <XAxis dataKey="year" stroke="currentColor" tick={{ fill: "currentColor" }} label={{ value: "Jahr (2026: bis 29. Oktober)", position: "insideBottom", offset: -2, fill: "currentColor", fontSize: 12 }} height={40} />
          <YAxis stroke="currentColor" tick={{ fill: "currentColor" }} tickFormatter={fmt} label={{ value: "Bestätigte Fälle", angle: -90, position: "insideLeft", fill: "currentColor", fontSize: 12 }} />
          <Tooltip formatter={(v) => [fmt(v), "Fälle"]} />
          <Bar dataKey="cases" name="Fälle">
            {data.map((d) => <Cell key={d.year} fill={d.year === "2026" ? "#D55E00" : "#0072B2"} />)}
            <LabelList dataKey="cases" position="top" formatter={fmt} fill="currentColor" fontSize={12} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
    <p className="src" style={{ opacity: 0.9 }}>Kurz: 2019: 1'274 · 2020: 13 · 2021: 49 · 2022: 121 · 2023: 59 · 2024: 285 · 2025: 2'289 · 2026: 4'852 (bis 29.10.).</p>
    <div className="src">Quelle: <a href="https://www.cdc.gov/measles/data-research/index.html" target="_blank" rel="noopener">CDC, Measles Cases and Outbreaks</a>, Stand 30. Oktober 2026; abgerufen am 31. Oktober 2026.</div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
