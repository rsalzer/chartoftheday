<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schweizer Gletscher: Eisverlust pro Jahrzehnt</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  body { margin: 0; padding: 12px; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: CanvasText; color-scheme: light dark; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; line-height: 1.25; }
  p.lead { margin: 0 0 12px; font-size: 1rem; line-height: 1.4; }
  .fallback, .source { font-size: .8rem; opacity: .8; margin-top: 8px; line-height: 1.4; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { ResponsiveContainer, BarChart, Bar, Cell, LabelList, XAxis, YAxis, CartesianGrid, Tooltip } = Recharts;

// Relative loss of Swiss-wide ice volume per period, as stated in the GLAMOS report 2025/2026.
const DATA = [
  { name: "1990–2000", v: 10 },
  { name: "2000–2010", v: 14 },
  { name: "2010–2020", v: 17 },
  { name: "2016–2026", v: 27 },
];
const GREY = "#8a8a8a", RED = "#d1495b";

const Tip = ({ active, payload }) => {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (
    <div style={{ background: "Canvas", color: "CanvasText", border: "1px solid #888", padding: "6px 10px", fontSize: 13 }}>
      <strong>{d.name}</strong><br />{d.v} % des Eisvolumens verloren
    </div>
  );
};

function App() {
  return (
    <div>
      <h1>Schweizer Gletscher: Im letzten Jahrzehnt ging über ein Viertel des Eises verloren</h1>
      <p className="lead">Allein 2026 schmolzen die Gletscher um 5,5 Prozent ihres Volumens – nach 2022 (5,9 Prozent) der zweithöchste Jahresverlust. Der Verlust pro Jahrzehnt hat sich seit 1990 stark beschleunigt.</p>
      <div role="img" aria-label="Säulendiagramm: Anteil des Schweizer Gletschereisvolumens, der pro Zeitraum verloren ging. 1990–2000 10 Prozent, 2000–2010 14 Prozent, 2010–2020 17 Prozent, 2016–2026 27 Prozent.">
        <ResponsiveContainer width="100%" height={320}>
          <BarChart data={DATA} margin={{ top: 20, right: 20, bottom: 24, left: 10 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#888" strokeOpacity={0.3} vertical={false} />
            <XAxis dataKey="name" tick={{ fill: "currentColor", fontSize: 12 }} />
            <YAxis domain={[0, 30]} unit=" %" tick={{ fill: "currentColor", fontSize: 12 }} label={{ value: "Verlust des Eisvolumens", angle: -90, position: "insideLeft", fill: "currentColor", fontSize: 12 }} />
            <Tooltip content={<Tip />} cursor={false} />
            <Bar dataKey="v" isAnimationActive={false} maxBarSize={80}>
              {DATA.map((d, i) => <Cell key={i} fill={i === 3 ? RED : GREY} />)}
              <LabelList dataKey="v" position="top" formatter={v => v + " %"} fill="currentColor" fontSize={13} />
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="fallback">Kernzahlen: Eisverlust 1990–2000 10 %, 2000–2010 14 %, 2010–2020 17 %, 2016–2026 27 %. Jahresverluste: 2022 5,9 %, 2023 4,4 %, 2025 3,0 %, 2026 5,5 %. Die Zeiträume 2010–2020 und 2016–2026 überlappen sich.</div>
      <div className="source">Quelle: <a href="https://doi.glamos.ch/pubs/annualrep/annualrep_2026.html" target="_blank" rel="noopener">GLAMOS, Annual mass balance of Swiss glaciers 2025/2026</a>; <a href="https://doi.glamos.ch/pubs/annualrep/annualrep_2025.html" target="_blank" rel="noopener">Bericht 2024/2025</a>; <a href="https://www.unifr.ch/unicom/de/news-events/news/35266/die-schweizer-gletscher-verlieren-weitere-funf-prozent-ihres-volumens" target="_blank" rel="noopener">Universität Freiburg, 1. Oktober 2026</a>. Abgerufen am 11. Oktober 2026.</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
