<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mostra-Rekord: Publikum strömt nach Venedig, die Fachwelt bleibt aus</title>
<style>
  :root {
    --ink: #0b0b0b; --muted: #898781; --sub: #52514e; --hair: #e1e0d9; --card: #fcfcfb;
    --series-1: #2a78d6; --series-2: #eb6834;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffffff; --muted: #898781; --sub: #c3c2b7; --hair: #2c2c2a; --card: #1a1a19;
      --series-1: #3987e5; --series-2: #d95926;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  h1 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.lead { font-size: 13.5px; line-height: 1.5; color: var(--sub); margin: 0 0 14px; max-width: 62ch; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 16px; }
  .kpi { flex: 1 1 150px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 11.5px; color: var(--muted); }
  .kpi .val { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 6px; font-size: 12px; color: var(--sub); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .source { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .source a { color: var(--sub); }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Mostra del Cinema Venedig 2026: 117'656 verkaufte Kinokarten, 14 Prozent mehr als im Rekordjahr 2025 (103'033) und neuer Publikumsrekord. Die Akkreditierungen des Fachpublikums stiegen im gleichen Zeitraum nur von 13'934 auf 14'000, also praktisch nicht.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// Ticket and accreditation figures are both indexed to 2025 = 100 so the two
// very different scales (six-figure ticket sales vs. five-figure accreditations)
// can share one axis without a dual-axis distortion. Absolute figures are kept
// alongside for the tooltip and KPI cards.
const DATA = [
  { year: '2025', ticketsIdx: 100, accredIdx: 100, ticketsAbs: 103033, accredAbs: 13934 },
  { year: '2026', ticketsIdx: 114.2, accredIdx: 100.5, ticketsAbs: 117656, accredAbs: 14000 }
];

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const axis = '#898781';
const grid = isDark ? '#2c2c2a' : '#e1e0d9';
const ink = isDark ? '#ffffff' : '#0b0b0b';
const surface = isDark ? '#1a1a19' : '#fcfcfb';
const seriesTickets = isDark ? '#3987e5' : '#2a78d6';
const seriesAccred = isDark ? '#d95926' : '#eb6834';

const fmtInt = (n) => n.toLocaleString('de-CH');

function ChartTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  const row = payload[0].payload;
  return (
    <div style={{ background: surface, border: '1px solid ' + grid,
      borderRadius: 8, padding: '8px 11px', fontSize: 12.5, color: ink, minWidth: 190 }}>
      <div style={{ fontWeight: 700, marginBottom: 4 }}>{label}</div>
      <div style={{ color: seriesTickets }}>Kinokarten: {fmtInt(row.ticketsAbs)} <span style={{ color: axis }}>(Index {row.ticketsIdx.toFixed(1)})</span></div>
      <div style={{ color: seriesAccred }}>Akkreditierungen: {fmtInt(row.accredAbs)} <span style={{ color: axis }}>(Index {row.accredIdx.toFixed(1)})</span></div>
    </div>
  );
}

function EndLabel(color, suffix) {
  return function Label(props) {
    const { x, y, index, value } = props;
    if (index !== DATA.length - 1) return null;
    return (
      <text x={x + 8} y={y + 4} fill={color} fontSize={12} fontWeight={700}>
        {(value >= 100 ? '+' : '') + (value - 100).toFixed(1) + suffix}
      </text>
    );
  };
}

function EndDot(color) {
  return function Dot(props) {
    const { cx, cy, index } = props;
    const r = index === DATA.length - 1 ? 5 : 4;
    return <circle cx={cx} cy={cy} r={r} fill={color} stroke={surface} strokeWidth={index === DATA.length - 1 ? 2 : 0} />;
  };
}

function App() {
  return (
    <div>
      <h1>Mostra-Rekord: Publikum strömt nach Venedig, die Fachwelt bleibt aus</h1>
      <p className="lead">
        An den 83. Filmfestspielen von Venedig wurden 2026 117'656 Kinokarten verkauft – 14 Prozent
        mehr als im bisherigen Rekordjahr 2025 (103'033) und der höchste Wert der Festivalgeschichte.
        Die Zahl der akkreditierten Fachbesucherinnen und -besucher stieg im gleichen Zeitraum kaum:
        von 13'934 auf 14'000.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Kinokarten 2026</div><div className="val">117'656 <small>+14%</small></div></div>
        <div className="kpi"><div className="lab">Kinokarten 2025</div><div className="val">103'033 <small>Rekordjahr</small></div></div>
        <div className="kpi"><div className="lab">Akkreditierungen 2026</div><div className="val">14'000 <small>+0,5%</small></div></div>
      </div>
      <div className="legend">
        <span><span className="dot" style={{ background: seriesTickets }}></span>Verkaufte Kinokarten (Publikum)</span>
        <span><span className="dot" style={{ background: seriesAccred }}></span>Akkreditierungen (Fachpublikum)</span>
      </div>
      <div role="img" aria-label="Slope-Chart: Verkaufte Kinokarten der Filmfestspiele Venedig stiegen 2025 auf 2026 indexiert von 100 auf 114,2 (103'033 auf 117'656 Karten, +14 Prozent), während Akkreditierungen des Fachpublikums nur von Index 100 auf 100,5 stiegen (13'934 auf 14'000).">
        <ResponsiveContainer width="100%" height={300}>
          <LineChart data={DATA} margin={{ top: 20, right: 56, bottom: 8, left: 4 }}>
            <CartesianGrid stroke={grid} vertical={false} />
            <XAxis dataKey="year" tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
            <YAxis domain={[95, 118]} tick={{ fill: axis, fontSize: 12 }} stroke={grid}
              tickFormatter={(v) => v.toFixed(0)} width={54} label={{ value: 'Index 2025=100', angle: -90, position: 'insideLeft', fill: axis, fontSize: 11 }} />
            <Tooltip content={<ChartTip />} />
            <Line type="linear" dataKey="ticketsIdx" name="Kinokarten" stroke={seriesTickets} strokeWidth={2}
              dot={EndDot(seriesTickets)} label={EndLabel(seriesTickets, '%')} isAnimationActive={false} />
            <Line type="linear" dataKey="accredIdx" name="Akkreditierungen" stroke={seriesAccred} strokeWidth={2}
              dot={EndDot(seriesAccred)} label={EndLabel(seriesAccred, '%')} isAnimationActive={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="source">
        Quelle: La Biennale di Venezia, Medienmitteilungen «Figures of the 83rd Venice International Film Festival»
        vom 13. September 2026
        (<a href="https://www.labiennale.org/en/news/figures-83rd-venice-international-film-festival" target="_blank" rel="noopener">labiennale.org</a>)
        und «I numeri della Biennale Cinema 2025»
        (<a href="https://www.labiennale.org/it/news/i-numeri-della-biennale-cinema-2025" target="_blank" rel="noopener">labiennale.org</a>).
        Stand: 15. September 2026.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
