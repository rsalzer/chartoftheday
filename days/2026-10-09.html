<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutscher Aussenhandel: Importe aus China wachsen, Exporte dorthin brechen ein</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:transparent;color:inherit}
h1{font-size:1.4rem;margin:0 0 8px}
p{margin:0 0 12px;line-height:1.45}
.src{font-size:.8rem;opacity:.8;margin-top:8px}
.fb{font-size:.85rem;opacity:.85;margin-top:8px}
a{color:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const {ResponsiveContainer,BarChart,Bar,XAxis,YAxis,Tooltip,Legend,ReferenceLine,LabelList,CartesianGrid}=Recharts;
const data=[
 {name:"EU",ex:7.2,im:2.8},
 {name:"USA",ex:1.1,im:5.8},
 {name:"China",ex:-12.9,im:10.1},
 {name:"Grossbritannien",ex:5.4,im:3.2}
];
const fmt=v=>(v>0?"+":"")+String(v).replace(".",",")+" %";
function App(){
 return (
  <div>
   <h1>Deutscher Aussenhandel: Importe aus China wachsen, Exporte dorthin brechen ein</h1>
   <p>Von Januar bis August 2026 lieferte Deutschland 12,9 Prozent weniger nach China als im Vorjahreszeitraum, importierte von dort aber 10,1 Prozent mehr. Insgesamt stiegen die Exporte im August gegenüber dem Vorjahresmonat um 6,2 Prozent.</p>
   <div role="img" aria-label="Balkendiagramm: Veränderung der deutschen Exporte und Importe Januar bis August 2026 gegenüber Vorjahr nach Handelspartner. China: Exporte minus 12,9 Prozent, Importe plus 10,1 Prozent." style={{width:"100%",height:340}}>
    <ResponsiveContainer>
     <BarChart data={data} margin={{left:0,right:20,top:20}}>
      <CartesianGrid strokeDasharray="3 3" opacity={0.3}/>
      <XAxis dataKey="name"/>
      <YAxis unit=" %" tickFormatter={v=>String(v).replace(".",",")} domain={[-15,12]}/>
      <Tooltip formatter={fmt}/>
      <Legend/>
      <ReferenceLine y={0} stroke="currentColor"/>
      <Bar dataKey="ex" name="Exporte aus Deutschland" fill="#1b9e77"><LabelList dataKey="ex" position="top" formatter={fmt} fontSize={11} fill="currentColor"/></Bar>
      <Bar dataKey="im" name="Importe nach Deutschland" fill="#d95f02"><LabelList dataKey="im" position="top" formatter={fmt} fontSize={11} fill="currentColor"/></Bar>
     </BarChart>
    </ResponsiveContainer>
   </div>
   <div className="fb">Kurz (Januar–August 2026 vs. Vorjahr): Exporte EU +7,2 %, USA +1,1 %, China −12,9 %, Grossbritannien +5,4 %; Importe EU +2,8 %, USA +5,8 %, China +10,1 %, Grossbritannien +3,2 %.</div>
   <div className="src">Quelle: <a href="https://www.destatis.de/DE/Presse/Pressemitteilungen/2026/10/PD26_356_51.html" target="_blank" rel="noopener">Statistisches Bundesamt (Destatis)</a>, Pressemitteilung Nr. 356 vom 08.10.2026 (vorläufige Ergebnisse), abgerufen am 09.10.2026.</div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
