<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ebola-Ausbruch im Kongo ist der grösste der Landesgeschichte</title>
<style>
  :root {
    --ink: #0b0b0b; --muted: #898781; --hair: #e1e0d9; --card: #fcfcfb;
    --cases: #2a78d6; --deaths: #eb6834; --record: #898781;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffffff; --muted: #c3c2b7; --hair: #2c2c2a; --card: #1a1a19;
      --cases: #3987e5; --deaths: #d95926; --record: #898781;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .kpi { flex: 1 1 130px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 12px; color: var(--muted); }
  .kpi .val { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .lead { font-size: 14px; line-height: 1.45; color: var(--ink); margin: 2px 0 14px; max-width: 62ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); margin: 2px 2px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 3px; display: inline-block; }
  .source { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .source a { color: var(--muted); text-decoration: underline; }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  h1 { font-size: 18px; line-height: 1.25; margin: 0 0 6px; }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Bundibugyo-Ebola-Ausbruch in der DR Kongo: von 83 Fällen am 21. Mai 2026 auf 4665 bestätigte Fälle und 2184 Tote am 12. August 2026 (Letalität 46,8 Prozent) – mehr Fälle als im bisherigen Rekordausbruch 2018–2020 mit 3317 Fällen.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ResponsiveContainer } = Recharts;

// Confirmed-case / death counts verified directly against WHO Disease Outbreak
// News items for the DRC Bundibugyo virus disease outbreak (2026-DON603,
// 2026-DON613, 2026-DON614, 2026-DON615). CFR = deaths / cases, cross-checked
// against each DON's own stated ratio.
const DATA = [
  { d: '21. Mai', cases: 83,   deaths: 9,    cfr: 10.8 },
  { d: '15. Jul', cases: 2124, deaths: 828,  cfr: 39.0 },
  { d: '30. Jul', cases: 3605, deaths: 1587, cfr: 44.0 },
  { d: '12. Aug', cases: 4665, deaths: 2184, cfr: 46.8 }
];
const PREV_RECORD = 3317; // DRC's 2018-2020 outbreak, per WHO DON614/DON615

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const axis = isDark ? '#c3c2b7' : '#898781';
const grid = isDark ? '#2c2c2a' : '#e1e0d9';

function ChartTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  const row = payload[0] && payload[0].payload;
  if (!row) return null;
  return (
    <div style={{ background: isDark ? '#20201a' : '#fff', border: '1px solid ' + grid,
      borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: isDark ? '#fff' : '#0b0b0b' }}>
      <div style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{label}</div>
      <div style={{ color: 'var(--cases)' }}>Fälle: {row.cases.toLocaleString('de-CH')}</div>
      <div style={{ color: 'var(--deaths)' }}>Tote: {row.deaths.toLocaleString('de-CH')}</div>
      <div style={{ color: axis }}>Letalität: {row.cfr.toLocaleString('de-CH')}%</div>
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Ebola-Ausbruch im Kongo ist der grösste der Landesgeschichte</h1>
      <p className="lead">
        Der im Mai 2026 in der Demokratischen Republik Kongo ausgebrochene Ebola-Ausbruch mit dem
        Bundibugyo-Virus hat sich seither mehr als verfünfzigfacht: von 83 Fällen am 21. Mai auf
        4665 bestätigte Fälle und 2184 Tote per 12. August – mehr als im bisherigen
        Rekordausbruch 2018–2020 (3317 Fälle). Am 18. August bezifferte die WHO die Lage bereits auf
        «nahezu 5000» Fälle und nannte den Ausbruch den zweitgrössten je weltweit verzeichneten.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Fälle (12. Aug.)</div><div className="val">4'665</div></div>
        <div className="kpi"><div className="lab">Todesfälle</div><div className="val">2'184</div></div>
        <div className="kpi"><div className="lab">Letalität</div><div className="val">46,8 <small>%</small></div></div>
        <div className="kpi"><div className="lab">Anstieg seit 21. Mai</div><div className="val">56×</div></div>
      </div>
      <div className="legend">
        <span><span className="swatch" style={{ background: 'var(--cases)' }}></span>Bestätigte Fälle</span>
        <span><span className="swatch" style={{ background: 'var(--deaths)' }}></span>Todesfälle</span>
        <span><span className="swatch" style={{ background: 'var(--record)', height: 2 }}></span>Rekord 2018–2020 (3317 Fälle)</span>
      </div>
      <div role="img" aria-label="Liniendiagramm der bestätigten Ebola-Fälle und Todesfälle in der DR Kongo von 21. Mai bis 12. August 2026: Anstieg von 83 auf 4665 Fälle und von 9 auf 2184 Tote, mit Überschreitung des bisherigen Rekords von 3317 Fällen zwischen Ende Juli und Mitte August.">
        <ResponsiveContainer width="100%" height={280}>
          <LineChart data={DATA} margin={{ top: 8, right: 12, bottom: 4, left: -8 }}>
            <CartesianGrid stroke={grid} vertical={false} />
            <ReferenceLine y={PREV_RECORD} stroke="var(--record)" strokeDasharray="5 4"
              label={{ value: 'Rekord 2018–2020: 3317', position: 'insideTopLeft', fill: axis, fontSize: 11 }} />
            <XAxis dataKey="d" tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
            <YAxis tick={{ fill: axis, fontSize: 12 }} stroke={grid} width={48}
              tickFormatter={(v) => v.toLocaleString('de-CH')} />
            <Tooltip content={<ChartTip />} />
            <Line type="monotone" dataKey="cases" name="Fälle" stroke="var(--cases)" strokeWidth={2}
              dot={{ r: 4, fill: 'var(--cases)', stroke: 'var(--cases)' }} isAnimationActive={false} />
            <Line type="monotone" dataKey="deaths" name="Tote" stroke="var(--deaths)" strokeWidth={2}
              dot={{ r: 4, fill: 'var(--deaths)', stroke: 'var(--deaths)' }} isAnimationActive={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="source">
        Quelle: WHO Disease Outbreak News, Bundibugyo-Virus-Ausbruch DR Kongo –
        <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON603" target="_blank" rel="noopener">21. Mai</a>,{' '}
        <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613" target="_blank" rel="noopener">15. Jul</a>,{' '}
        <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON614" target="_blank" rel="noopener">30. Jul</a>,{' '}
        <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON615" target="_blank" rel="noopener">12. Aug</a>.
        Stand: 23. August 2026.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
