<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Der Japankäfer erreicht immer mehr Kantone</title>
<style>
  :root {
    --ink: #17160f; --muted: #6c6b63; --hair: #e3e1d7; --card: #ffffff;
    --series1: #2a78d6; --accent: #eb6834; --fill: rgba(42,120,214,0.16);
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0eee4; --muted: #9a988d; --hair: #2a2924; --card: #1b1b16;
      --series1: #3987e5; --accent: #d95926; --fill: rgba(57,135,229,0.22);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 6px; }
  p.lead { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 60em; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .kpi { flex: 1 1 150px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 12px; color: var(--muted); }
  .kpi .val { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 13px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
  .source { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .source a { color: var(--muted); }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Anzahl Schweizer Kantone mit bestätigtem Japankäfer-Befall, 2017 bis 2026: Anstieg von 1 (Tessin, 2017) auf 10 (2025). 2026 kam kein neuer Kanton hinzu, aber die Stadt Luzern meldete bei der Allmend einen zweiten eigenen Befallsherd neben jenem in Neuenkirch.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceDot, ResponsiveContainer } = Recharts;

// Cumulative count of Swiss cantons with a confirmed Japanese-beetle (Japankäfer)
// infestation focus / containment zone, by year first detected. Source: BLW
// (Bundesamt für Landwirtschaft), "Japankäfer – Aktuelle Situation", updated
// May 2026: Tessin 2017 (first specimens; containment zone 2020); Zürich +
// Wallis 2023; Schwyz, Basel-Stadt, Basel-Landschaft 2024; Genf, Waadt,
// Solothurn, Luzern (Neuenkirch) 2025. Cross-checked against Kanton Luzern
// (lawa.lu.ch), which reports the July 2026 second focus at the Allmend as an
// additional focus within the already-counted canton of Luzern — not a new
// canton, so 2026 stays flat at 10 in this series.
const DATA = [
  { year: 2017, cantons: 1,  added: ['Tessin'] },
  { year: 2018, cantons: 1,  added: [] },
  { year: 2019, cantons: 1,  added: [] },
  { year: 2020, cantons: 1,  added: [] },
  { year: 2021, cantons: 1,  added: [] },
  { year: 2022, cantons: 1,  added: [] },
  { year: 2023, cantons: 3,  added: ['Zürich', 'Wallis'] },
  { year: 2024, cantons: 6,  added: ['Schwyz', 'Basel-Stadt', 'Basel-Landschaft'] },
  { year: 2025, cantons: 10, added: ['Genf', 'Waadt', 'Solothurn', 'Luzern'] },
  { year: 2026, cantons: 10, added: [], note: '2. Herd (Allmend), kein neuer Kanton' }
];

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const axis = isDark ? '#9a988d' : '#6c6b63';
const grid = isDark ? '#2c2c2a' : '#e3e1d7';

function ChartTip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const row = payload[0].payload;
  return (
    <div style={{ background: isDark ? '#20201a' : '#fff', border: '1px solid ' + grid,
      borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: isDark ? '#f0eee4' : '#17160f', maxWidth: 220 }}>
      <div style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{row.year} — {row.cantons} Kantone</div>
      {row.added.length > 0 && <div style={{ color: axis }}>neu: {row.added.join(', ')}</div>}
      {row.note && <div style={{ color: 'var(--accent)' }}>{row.note}</div>}
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Der Japankäfer erreicht immer mehr Kantone</h1>
      <p className="lead">
        Ende Juli 2026 hat der Kanton Luzern bei der Allmend einen zweiten Befallsherd des Japankäfers
        festgestellt – zusätzlich zum bereits 2025 entdeckten Herd bei Neuenkirch. Schweizweit ist die
        Zahl der Kantone mit bestätigtem Befall seit der Ersteinschleppung im Tessin 2017 auf zehn
        gestiegen, vier davon allein im Sommer 2025.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Betroffene Kantone 2025</div><div className="val">10</div></div>
        <div className="kpi"><div className="lab">Start der Ausbreitung</div><div className="val">2017 <small>Tessin</small></div></div>
        <div className="kpi"><div className="lab">Neu 2025 dazugekommen</div><div className="val">4 <small>Kantone</small></div></div>
      </div>
      <div role="img" aria-label="Flächendiagramm: Anzahl Schweizer Kantone mit bestätigtem Japankäfer-Befall, 2017 bis 2026. Anstieg von 1 Kanton (Tessin) 2017 auf 10 Kantone 2025 — davon vier neu allein 2025 (Genf, Waadt, Solothurn, Luzern). 2026 kein neuer Kanton, aber ein zweiter Befallsherd in Luzern bei der Allmend.">
        <ResponsiveContainer width="100%" height={300}>
          <AreaChart data={DATA} margin={{ top: 8, right: 16, bottom: 4, left: -8 }}>
            <CartesianGrid stroke={grid} vertical={false} />
            <XAxis dataKey="year" type="number" domain={[2017, 2026]} ticks={[2017, 2019, 2021, 2023, 2024, 2025, 2026]}
              tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
            <YAxis domain={[0, 12]} ticks={[0, 2, 4, 6, 8, 10, 12]} tick={{ fill: axis, fontSize: 12 }} stroke={grid}
              width={30} />
            <Tooltip content={<ChartTip />} />
            <Area type="stepAfter" dataKey="cantons" stroke="var(--series1)" strokeWidth={2}
              fill="var(--fill)" dot={{ r: 3, fill: 'var(--series1)', stroke: 'var(--series1)' }}
              activeDot={{ r: 5 }} isAnimationActive={false} />
            <ReferenceDot x={2026} y={10} r={5} fill="var(--accent)" stroke={isDark ? '#1b1b16' : '#ffffff'}
              strokeWidth={2} isFront={true} />
          </AreaChart>
        </ResponsiveContainer>
      </div>
      <div className="source">
        Quelle: <a href="https://www.blw.admin.ch/de/japankaefer-aktuelle-situation" target="_blank" rel="noopener">Bundesamt für Landwirtschaft BLW</a>,{' '}
        <a href="https://lawa.lu.ch/landwirtschaft/pflanzenschutz1/japankaefer" target="_blank" rel="noopener">Kanton Luzern (lawa.lu.ch)</a> · 30. Juli 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
