<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotellerie: Im September endlich wieder deutlich im Plus</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: transparent; color: inherit; }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 8px; }
  p.lead { margin: 0 0 16px; font-size: 1rem; line-height: 1.45; }
  p.fallback { font-size: .85rem; opacity: .8; margin: 8px 0; }
  p.source { font-size: .8rem; opacity: .85; margin: 8px 0 0; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ReferenceLine, ResponsiveContainer } = Recharts;

// Year-on-year change in hotel overnight stays (%), Switzerland.
// Apr, May, Jun, Aug, Sep: first estimate; Jul: later published figure.
const DATA = [
  { m: "Apr", total: -1.1, ausland: -5.9, inland: 4.2 },
  { m: "Mai", total: -1.2, ausland: -1.8, inland: -0.5 },
  { m: "Jun", total: -2.4, ausland: -4.4, inland: -0.1 },
  { m: "Jul", total: 0.5, ausland: -2.4, inland: 3.9 },
  { m: "Aug", total: -2.1, ausland: -2.6, inland: -1.5 },
  { m: "Sep", total: 5.5, ausland: 6.4, inland: 4.4 },
];
const C = { ausland: "#d97b29", inland: "#3b82c4", total: "#8a8f98" };
const fmt = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(".", ",") + " %";

function App() {
  const title = "Hotellerie: Im September endlich wieder deutlich im Plus";
  return (
    <>
      <h1>{title}</h1>
      <p className="lead">
        Die Schweizer Hotels verbuchten im September 5,5 % mehr Logiernächte als im Vorjahresmonat – erstmals seit Beginn des Irankriegs Ende Februar legten auch die ausländischen Gäste zu (+6,4 %). Von April bis August lagen sie jeden Monat im Minus.
      </p>
      <div role="img" aria-label="Liniendiagramm: Veränderung der Hotel-Logiernächte in der Schweiz gegenüber dem Vorjahresmonat, April bis September 2026, getrennt nach ausländischen und inländischen Gästen sowie total. Im September steigen alle drei Werte deutlich: Ausland +6,4 %, Inland +4,4 %, total +5,5 %." style={{ width: "100%", height: 380 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={DATA} margin={{ top: 10, right: 20, bottom: 5, left: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.2} />
            <XAxis dataKey="m" stroke="currentColor" tick={{ fill: "currentColor" }} />
            <YAxis stroke="currentColor" tick={{ fill: "currentColor" }} tickFormatter={(v) => v + " %"} domain={[-8, 8]} label={{ value: "Veränderung zum Vorjahresmonat", angle: -90, position: "insideLeft", fill: "currentColor", style: { textAnchor: "middle", fontSize: 12 } }} />
            <ReferenceLine y={0} stroke="currentColor" strokeOpacity={0.6} />
            <Tooltip formatter={(v) => fmt(v)} contentStyle={{ background: "Canvas", color: "CanvasText" }} />
            <Legend />
            <Line type="monotone" dataKey="ausland" name="Ausländische Gäste" stroke={C.ausland} strokeWidth={3} dot={{ r: 4 }} />
            <Line type="monotone" dataKey="inland" name="Inländische Gäste" stroke={C.inland} strokeWidth={3} dot={{ r: 4 }} />
            <Line type="monotone" dataKey="total" name="Total" stroke={C.total} strokeWidth={2} strokeDasharray="6 4" dot={{ r: 3 }} />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <p className="fallback">Kernzahlen September 2026 gegenüber September 2025: total +5,5 %, Ausland +6,4 %, Inland +4,4 %. August: total −2,1 %.</p>
      <p className="source">
        Quelle: Bundesamt für Statistik (HESTA-Flash), wiedergegeben von
        {" "}<a href="https://www.cash.ch/news/schweizer-hotellerie-im-september-mit-deutlich-mehr-ubernachtungen-977010" target="_blank" rel="noopener">cash.ch (Sep.)</a>,
        {" "}<a href="https://www.cash.ch/news/schweizer-hotels-spuren-weiterhin-die-folgen-des-nahost-konflikts-974177" target="_blank" rel="noopener">cash.ch (Aug.)</a>,
        {" "}<a href="https://www.moneycab.com/style/hotellerie-im-juli-dank-schweizer-gaesten-wieder-im-plus/amp/" target="_blank" rel="noopener">Moneycab (Jul.)</a>,
        {" "}<a href="https://www.cash.ch/news/schweizer-hotellerie-auch-im-juni-mit-weniger-ubernachtungen-953365" target="_blank" rel="noopener">cash.ch (Jun.)</a>,
        {" "}<a href="https://www.cash.ch/news/schweizer-hotellerie-mit-weniger-ubernachtungen-im-mai-945396" target="_blank" rel="noopener">cash.ch (Mai)</a>,
        {" "}<a href="https://www.cash.ch/news/schweizer-hotellerie-mit-weniger-ubernachtungen-im-april-938266" target="_blank" rel="noopener">cash.ch (Apr.)</a>.
        Hinweis: Werte für April, Mai, Juni, August und September sind erste Schätzungen, Juli ein späterer Stand; die definitiven Zahlen für September folgen am 5. November. Stand: 25. Oktober 2026.
      </p>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
