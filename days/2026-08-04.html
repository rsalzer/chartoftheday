<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Legionellen-Ausbruch in Basel: 26 Fälle, 7 auf der Intensivstation</title>
<style>
  :root {
    --ink: #0b0b0b; --muted: #52514e; --axis: #898781; --hair: #e1e0d9; --card: #fcfcfb;
    --sev-1: #86b6ef; --sev-2: #5598e7; --sev-3: #2a78d6; --sev-4: #184f95;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffffff; --muted: #c3c2b7; --axis: #898781; --hair: #2c2c2a; --card: #1a1a19;
      --sev-1: #86b6ef; --sev-2: #5598e7; --sev-3: #2a78d6; --sev-4: #184f95;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  h1 { font-size: 17px; line-height: 1.35; margin: 0 0 6px; }
  p.lead { font-size: 13.5px; line-height: 1.5; color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 16px; }
  .kpi { flex: 1 1 130px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 12px; color: var(--muted); }
  .kpi .val { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--muted); margin: 10px 2px 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .foot a { color: var(--muted); }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Legionellen-Ausbruch Basel-Stadt seit 21. Juli 2026: 26 bestätigte Fälle. Davon 1 nicht hospitalisiert, 18 auf der Normalstation, 6 auf der Intensivstation überlebt, 1 verstorben (7 insgesamt auf der Intensivstation, 1 Todesfall). Normalerweise treten in Basel-Stadt 7 bis 20 Fälle pro Jahr auf.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

// Verified against the Basel-Stadt Gesundheitsdepartement press release
// (26 confirmed, 25 hospitalised, 7 of those in ICU, 1 death). Segments are
// derived (25-7=18 ward-only, 7-1=6 ICU-survived, 26-25=1 not hospitalised)
// and sum back to the reported total of 26.
const SEGMENTS = [
  { key: 'none', label: 'Nicht hospitalisiert', value: 1, color: 'var(--sev-1)' },
  { key: 'ward', label: 'Hospitalisiert, Normalstation', value: 18, color: 'var(--sev-2)' },
  { key: 'icu', label: 'Intensivstation (überlebt)', value: 6, color: 'var(--sev-3)' },
  { key: 'died', label: 'Verstorben', value: 1, color: 'var(--sev-4)' }
];
const TOTAL = SEGMENTS.reduce((s, d) => s + d.value, 0); // 26

const row = { name: 'Alle bestätigten Fälle' };
SEGMENTS.forEach((s) => { row[s.key] = s.value; });
const data = [row];

function pct(v) { return Math.round((v / TOTAL) * 1000) / 10; }

function ChartTip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const p = payload[payload.length - 1];
  const seg = SEGMENTS.find((s) => s.key === p.dataKey);
  if (!seg) return null;
  return (
    <div style={{ background: 'var(--card)', border: '1px solid var(--hair)',
      borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: 'var(--ink)' }}>
      <div style={{ fontWeight: 600 }}>{seg.label}</div>
      <div style={{ color: 'var(--muted)' }}>{seg.value} von {TOTAL} Fällen ({pct(seg.value)}%)</div>
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Legionellen-Ausbruch in Basel: 26 Fälle, 7 auf der Intensivstation</h1>
      <p className="lead">
        Seit der ersten Häufungsmeldung am 21. Juli 2026 zählt der Kanton Basel-Stadt 26 bestätigte
        Legionellose-Fälle – mehr, als laut der stellvertretenden Kantonsärztin Eva Würfel sonst in
        einem ganzen Jahr auftreten (7 bis 20). 25 der Erkrankten mussten ins Spital, 7 davon auf die
        Intensivstation; ein 69-jähriger Mann ist gestorben.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Bestätigte Fälle</div><div className="val">26</div></div>
        <div className="kpi"><div className="lab">Auf der Intensivstation</div><div className="val">7</div></div>
        <div className="kpi"><div className="lab">Todesfälle</div><div className="val">1</div></div>
      </div>
      <div role="img" aria-label="Gestapeltes Balkendiagramm: von 26 bestätigten Legionellen-Fällen in Basel-Stadt war 1 nicht hospitalisiert, 18 lagen auf der Normalstation, 6 auf der Intensivstation und überlebten, 1 Person ist verstorben.">
        <ResponsiveContainer width="100%" height={132}>
          <BarChart data={data} layout="vertical" margin={{ top: 8, right: 12, bottom: 4, left: 4 }}>
            <XAxis type="number" domain={[0, TOTAL]} tick={{ fill: 'var(--axis)', fontSize: 12 }}
              stroke="var(--hair)" tickFormatter={(v) => v} />
            <YAxis type="category" dataKey="name" width={4} tick={false} axisLine={false} tickLine={false} />
            <Tooltip content={<ChartTip />} cursor={{ fill: 'rgba(137,135,129,0.12)' }} />
            {SEGMENTS.map((s, i) => (
              <Bar key={s.key} dataKey={s.key} stackId="a" fill={s.color} isAnimationActive={false}
                stroke="var(--card)" strokeWidth={2}
                radius={i === 0 ? [4, 0, 0, 4] : i === SEGMENTS.length - 1 ? [0, 4, 4, 0] : 0} />
            ))}
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="legend">
        {SEGMENTS.map((s) => (
          <span key={s.key}>
            <span className="swatch" style={{ background: s.color }}></span>
            {s.label} — {s.value} ({pct(s.value)}%)
          </span>
        ))}
      </div>
      <div className="foot">
        Quellen: <a href="https://www.bs.ch/medienmitteilungen/gd/2026-legionellenausbruch-im-kanton-basel-stadt" target="_blank" rel="noopener">Gesundheitsdepartement Basel-Stadt, Medienmitteilung (3.8.2026)</a>,{' '}
        <a href="https://www.srf.ch/news/schweiz/basel-legionellen-ausbruch-ein-mann-gestorben-25-personen-im-spital" target="_blank" rel="noopener">SRF</a>,{' '}
        <a href="https://www.20min.ch/story/basel-aussergewoehnlich-viele-legionellen-faelle-nun-informiert-kanton-103612518" target="_blank" rel="noopener">20 Minuten</a>
        {' '}— Stand 4.8.2026.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
