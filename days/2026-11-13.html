<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sozialhilfequote 2025 nach Gruppen</title>
<style>
  body{margin:0;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:transparent;color:CanvasText;color-scheme:light dark}
  h1{font-size:1.4rem;line-height:1.25;margin:0 0 8px}
  p.lead{margin:0 0 12px;font-size:1rem;line-height:1.45}
  p.fallback{font-size:.85rem;opacity:.8;margin:8px 0}
  p.source{font-size:.8rem;opacity:.85;margin:8px 0 0}
  a{color:#3b82f6}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { ResponsiveContainer, ScatterChart, Scatter, XAxis, YAxis, ZAxis, CartesianGrid, Tooltip, LabelList, Cell } = Recharts;

// Sozialhilfequote 2025 in % (BFS, Medienmitteilung 27.10.2026)
const data = [
  { group: "Ausländer/innen", v: 5.4 },
  { group: "Kinder und Jugendliche", v: 4.8 },
  { group: "Geschiedene", v: 4.2 },
  { group: "Ledige", v: 3.7 },
  { group: "Gesamtbevölkerung", v: 2.9 },
  { group: "Schweizer/innen", v: 1.9 },
  { group: "Verheiratete", v: 1.4 },
  { group: "Verwitwete", v: 0.8 },
];
const fmt = (v) => String(v).replace(".", ",");

function App() {
  return (
    <div>
      <h1>Sozialhilfe: Ausländer und Kinder am häufigsten betroffen</h1>
      <p className="lead">2025 bezogen rund 267 300 Personen wirtschaftliche Sozialhilfe, 4,5 Prozent mehr als im Vorjahr; die Quote liegt bei 2,9 Prozent. Je nach Gruppe reicht sie von 0,8 bis 5,4 Prozent. Wegen methodischer Neuerungen sind Vergleiche mit früheren Jahren mit Vorsicht zu lesen.</p>
      <div role="img" aria-label="Punktdiagramm: Sozialhilfequote 2025 in Prozent. Ausländer 5,4, Kinder und Jugendliche 4,8, Geschiedene 4,2, Ledige 3,7, Gesamtbevölkerung 2,9, Schweizer 1,9, Verheiratete 1,4, Verwitwete 0,8." style={{ width: "100%", height: 360 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ScatterChart margin={{ top: 8, right: 36, bottom: 24, left: 8 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.2} />
            <XAxis type="number" dataKey="v" domain={[0, 6]} tick={{ fill: "currentColor", fontSize: 12 }} tickFormatter={fmt} label={{ value: "Sozialhilfequote 2025 in Prozent", position: "insideBottom", offset: -12, fill: "currentColor", fontSize: 12 }} />
            <YAxis type="category" dataKey="group" width={150} interval={0} tick={{ fill: "currentColor", fontSize: 12 }} />
            <ZAxis range={[110, 110]} />
            <Tooltip cursor={false} formatter={(v) => [fmt(v) + " %", "Quote"]} contentStyle={{ background: "Canvas", color: "CanvasText" }} />
            <Scatter data={data} isAnimationActive={false}>
              {data.map((d) => <Cell key={d.group} fill={d.group === "Gesamtbevölkerung" ? "#f59e0b" : "#3b82f6"} />)}
              <LabelList dataKey="v" position="right" formatter={fmt} fill="currentColor" fontSize={12} />
            </Scatter>
          </ScatterChart>
        </ResponsiveContainer>
      </div>
      <p className="fallback">Sozialhilfequote 2025: Ausländer 5,4 %, Kinder und Jugendliche 4,8 %, Geschiedene 4,2 %, Ledige 3,7 %, gesamt 2,9 %, Schweizer 1,9 %, Verheiratete 1,4 %, Verwitwete 0,8 %.</p>
      <p className="source">Quelle: <a href="https://www.bfs.admin.ch/de/newnsb/oEA748pQVJJl" target="_blank" rel="noopener">Bundesamt für Statistik, Sozialhilfestatistik 2025 (Medienmitteilung vom 27. Oktober 2026)</a>. Abgerufen am 13. November 2026. Die Gruppen überschneiden sich (z. B. Kinder und Ausländer/innen). Nicht dargestellt: Flüchtlinge (83,6 %) und Schutzbedürftige mit Status S (81,1 %), deren Quote nach anderer Grundgesamtheit berechnet ist.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
