<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wohneigentum wird weiter teurer: Einfamilienhäuser legen am stärksten zu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:transparent;color:inherit}
  h1{font-size:1.4rem;margin:0 0 8px;line-height:1.25}
  p{margin:0 0 12px;line-height:1.45}
  .src{font-size:.8rem;opacity:.8;margin-top:8px}
  .src a{color:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Cell, LabelList } = Recharts;
const data = [
  { name: "Einfamilienhäuser", v: 2.1 },
  { name: "Gesamtindex", v: 1.7 },
  { name: "Stockwerkeigentum", v: 1.3 },
];
const fmt = (n) => n.toFixed(1).replace(".", ",") + " %";
const App = () => (
  <div>
    <h1>Wohneigentum wird weiter teurer: Einfamilienhäuser legen am stärksten zu</h1>
    <p>Die Preise für Wohneigentum sind im 3. Quartal 2026 gegenüber dem Vorquartal um 1,7 Prozent gestiegen (Index: 129,8; 4. Quartal 2019 = 100). Einfamilienhäuser verteuerten sich mit 2,1 Prozent stärker als Stockwerkeigentum mit 1,3 Prozent.</p>
    <div role="img" aria-label="Balkendiagramm: Veränderung der Wohneigentumspreise im 3. Quartal 2026 gegenüber dem Vorquartal. Einfamilienhäuser plus 2,1 Prozent, Gesamtindex plus 1,7 Prozent, Stockwerkeigentum plus 1,3 Prozent." style={{ width: "100%", height: 260 }}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={data} layout="vertical" margin={{ top: 10, right: 50, left: 10, bottom: 25 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="currentColor" strokeOpacity={0.2} horizontal={false} />
          <XAxis type="number" domain={[0, 2.5]} stroke="currentColor" tick={{ fill: "currentColor" }} tickFormatter={(v) => String(v).replace(".", ",")} label={{ value: "Veränderung gegenüber Vorquartal (%)", position: "insideBottom", offset: -12, fill: "currentColor", fontSize: 12 }} />
          <YAxis type="category" dataKey="name" width={140} stroke="currentColor" tick={{ fill: "currentColor" }} />
          <Tooltip formatter={(v) => [fmt(v), "Veränderung"]} />
          <Bar dataKey="v" name="Veränderung">
            {data.map((d) => <Cell key={d.name} fill={d.name === "Gesamtindex" ? "#0072B2" : "#E69F00"} />)}
            <LabelList dataKey="v" position="right" formatter={fmt} fill="currentColor" fontSize={12} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
    <p className="src" style={{ opacity: 0.9 }}>Kurz: 3. Quartal 2026 gegenüber Vorquartal – Einfamilienhäuser +2,1 %, Gesamtindex +1,7 %, Stockwerkeigentum +1,3 %.</p>
    <div className="src">Quelle: <a href="https://www.bfs.admin.ch/de/newnsb/zEeBMwJlPOBh" target="_blank" rel="noopener">Bundesamt für Statistik, Wohnimmobilienpreisindex IMPI</a>, Medienmitteilung vom 27. Oktober 2026; abgerufen am 4. November 2026.</div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
