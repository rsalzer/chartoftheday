<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erdbeben in Kumamoto: Amtliche Opferzahl versechsfacht sich binnen 24 Stunden</title>
<style>
  :root {
    --ink: #0b0b0b; --muted: #52514e; --axis: #898781; --hair: #e1e0d9; --card: #fcfcfb;
    --series1: #2a78d6; --series2: #eb6834;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffffff; --muted: #c3c2b7; --axis: #898781; --hair: #2c2c2a; --card: #1a1a19;
      --series1: #3987e5; --series2: #d95926;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 6px; }
  p.lead { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 60em; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .kpi { flex: 1 1 150px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 12px; color: var(--muted); }
  .kpi .val { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 13px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin: 6px 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .source { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .source a { color: var(--muted); }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Amtlich bestätigte Zahl der Todesopfer nach dem Erdbeben in Kumamoto (Japan) laut den Lageberichten des japanischen Kabinettsbüros: 2 Tote am 29. Juli 2026, 7 Uhr; 3 Tote am 29. Juli, 14 Uhr; 12 Tote am 30. Juli, 6.30 Uhr. Verletzte im selben Zeitraum: 7, 23, 77.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

// Tote (deaths) and Verletzte (injured) at each successive government situation
// report after the M7.1 Kumamoto earthquake of 28 July 2026. Source: Japanese
// Cabinet Office (内閣府), "令和8年熊本地震に係る被害状況等について" — the
// standardised 人的被害 summary table, cross-checked across three sequential
// reports (each report explicitly supersedes and revises the prior one's count).
const DATA = [
  { label: '29.7., 7 Uhr',    tote: 2,  verletzte: 7  },
  { label: '29.7., 14 Uhr',   tote: 3,  verletzte: 23 },
  { label: '30.7., 6.30 Uhr', tote: 12, verletzte: 77 }
];

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const axis = '#898781';
const grid = isDark ? '#2c2c2a' : '#e1e0d9';
const ink = isDark ? '#ffffff' : '#0b0b0b';
const surface = isDark ? '#1a1a19' : '#fcfcfb';

function ChartTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: surface, border: '1px solid ' + grid,
      borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: ink }}>
      <div style={{ fontWeight: 600, marginBottom: 2 }}>{label}</div>
      {payload.map((p) => (
        <div key={p.dataKey} style={{ fontVariantNumeric: 'tabular-nums' }}>
          <span style={{ color: p.color }}>●</span> {p.dataKey === 'tote' ? 'Tote' : 'Verletzte'}: {p.value}
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Erdbeben in Kumamoto: Amtliche Opferzahl versechsfacht sich binnen 24 Stunden</h1>
      <p className="lead">
        Beim Erdbeben der Stärke 7,1 vom 28. Juli 2026 in der japanischen Präfektur Kumamoto ist die
        amtlich bestätigte Zahl der Todesopfer laut den Lageberichten des japanischen Kabinettsbüros
        innerhalb von rund 24 Stunden von 2 auf 12 gestiegen, während Rettungskräfte weiter nach
        Verschütteten suchten. Lokale Medien in Kumamoto meldeten bis zum 31. Juli bereits deutlich
        höhere, bislang nicht in einem vergleichbaren amtlichen Lagebericht bestätigte Opferzahlen von
        über 30.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Tote, 30.7., 6.30 Uhr</div><div className="val">12</div></div>
        <div className="kpi"><div className="lab">Tote, 29.7., 7 Uhr</div><div className="val">2</div></div>
        <div className="kpi"><div className="lab">Verletzte, 30.7., 6.30 Uhr</div><div className="val">77</div></div>
      </div>
      <div className="legend">
        <span><i className="swatch" style={{ background: 'var(--series1)' }}></i>Tote</span>
        <span><i className="swatch" style={{ background: 'var(--series2)' }}></i>Verletzte</span>
      </div>
      <div role="img" aria-label="Balkendiagramm: Zahl der Toten und Verletzten nach dem Erdbeben in Kumamoto, in drei aufeinanderfolgenden amtlichen Lageberichten. Tote: 2 am 29. Juli 7 Uhr, 3 am 29. Juli 14 Uhr, 12 am 30. Juli 6.30 Uhr. Verletzte: 7, 23, 77 zu den gleichen Zeitpunkten.">
        <ResponsiveContainer width="100%" height={300}>
          <BarChart data={DATA} margin={{ top: 8, right: 16, bottom: 4, left: -8 }} barGap={4}>
            <CartesianGrid stroke={grid} vertical={false} />
            <XAxis dataKey="label" tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
            <YAxis tick={{ fill: axis, fontSize: 12 }} stroke={grid} width={30} />
            <Tooltip content={<ChartTip />} />
            <Bar dataKey="tote" name="Tote" fill="var(--series1)" radius={[4, 4, 0, 0]} isAnimationActive={false} />
            <Bar dataKey="verletzte" name="Verletzte" fill="var(--series2)" radius={[4, 4, 0, 0]} isAnimationActive={false} />
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="source">
        Quelle: Japanisches Kabinettsbüro (内閣府),{' '}
        <a href="https://www.bousai.go.jp/updates/r8kumamoto_jishin/pdf/r8kumamoto_jishin_20260729.pdf" target="_blank" rel="noopener">Lagebericht 29.7., 7 Uhr</a>,{' '}
        <a href="https://www.bousai.go.jp/updates/r8kumamoto_jishin/pdf/r8kumamoto_jishin_20260729-1400.pdf" target="_blank" rel="noopener">14 Uhr</a>,{' '}
        <a href="https://www.bousai.go.jp/updates/r8kumamoto_jishin/pdf/r8kumamoto_jishin_20260730.pdf" target="_blank" rel="noopener">30.7., 6.30 Uhr</a> · 31. Juli 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
