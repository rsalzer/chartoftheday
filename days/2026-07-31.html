<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ebola im Kongo wächst schneller als je zuvor</title>
<style>
  :root {
    --ink: #0b0b0b; --muted: #52514e; --axis: #898781; --hair: #e1e0d9; --card: #fcfcfb;
    --series1: #2a78d6; --series2: #e34948;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffffff; --muted: #c3c2b7; --axis: #898781; --hair: #2c2c2a; --card: #1a1a19;
      --series1: #3987e5; --series2: #e66767;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--card); color: var(--ink); font-family: var(--sans); }
  #root { padding: 14px 16px 18px; }
  h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 6px; }
  p.lead { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 60em; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .kpi { flex: 1 1 150px; border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .kpi .lab { font-size: 12px; color: var(--muted); }
  .kpi .val { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .val small { font-size: 13px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin: 6px 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .source { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .source a { color: var(--muted); }
  .fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root">
  <p class="fallback">Kumulierte bestätigte Ebola-Fälle und Todesfälle in der Demokratischen Republik Kongo (Bundibugyo-Virus): 83 Fälle/9 Tote am 21. Mai 2026, 1003/254 am 20. Juni, 2124/828 am 15. Juli, 3200/1405 am 26. Juli, 3360/1487 am 27. Juli, 3442/1521 am 29. Juli 2026.</p>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// Cumulative confirmed cases/deaths for DRC only (Uganda's small, separately
// declared-over side outbreak excluded for a consistent series). Cross-checked
// across independent reports rather than a single running feed:
// WHO Disease Outbreak News DON603 (21 May), Africanews citing DRC Ministry of
// Health (20/22 June), WHO DON613 (15 July), MSF (26 July), WHO/ECDC (27 July),
// DRC government via AP wire (29 July).
const DATA = [
  { label: '21.05.', faelle: 83,   tote: 9    },
  { label: '20.06.', faelle: 1003, tote: 254  },
  { label: '15.07.', faelle: 2124, tote: 828  },
  { label: '26.07.', faelle: 3200, tote: 1405 },
  { label: '27.07.', faelle: 3360, tote: 1487 },
  { label: '29.07.', faelle: 3442, tote: 1521 }
];

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const axis = '#898781';
const grid = isDark ? '#2c2c2a' : '#e1e0d9';
const ink = isDark ? '#ffffff' : '#0b0b0b';
const surface = isDark ? '#1a1a19' : '#fcfcfb';

function ChartTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: surface, border: '1px solid ' + grid,
      borderRadius: 8, padding: '6px 10px', fontSize: 12.5, color: ink }}>
      <div style={{ fontWeight: 600, marginBottom: 2 }}>{label} 2026</div>
      {payload.map((p) => (
        <div key={p.dataKey} style={{ fontVariantNumeric: 'tabular-nums' }}>
          <span style={{ color: p.color }}>●</span> {p.dataKey === 'faelle' ? 'Fälle' : 'Todesfälle'}: {p.value.toLocaleString('de-CH')}
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <div>
      <h1>Ebola im Kongo wächst schneller als je zuvor</h1>
      <p className="lead">
        Der im Mai 2026 in der Demokratischen Republik Kongo ausgebrochene Ebola-Ausbruch mit dem
        Bundibugyo-Virus gilt laut Weltgesundheitsorganisation und kongolesischer Regierung als der am
        schnellsten wachsende seiner Art: Bis am 29. Juli stiegen die bestätigten Fälle auf 3442 und die
        Todesfälle auf 1521, eine Sterblichkeitsrate von rund 44 Prozent. Die Westafrika-Epidemie von
        2014 bis 2016 brauchte für 1000 Tote noch rund acht Monate, diesmal waren es laut Behördenangaben
        nur rund zwei Monate.
      </p>
      <div className="cards">
        <div className="kpi"><div className="lab">Fälle, 29.7.</div><div className="val">3442</div></div>
        <div className="kpi"><div className="lab">Todesfälle, 29.7.</div><div className="val">1521</div></div>
        <div className="kpi"><div className="lab">Sterblichkeitsrate</div><div className="val">44 <small>%</small></div></div>
      </div>
      <div className="legend">
        <span><i className="swatch" style={{ background: 'var(--series1)' }}></i>Bestätigte Fälle</span>
        <span><i className="swatch" style={{ background: 'var(--series2)' }}></i>Todesfälle</span>
      </div>
      <div role="img" aria-label="Liniendiagramm: kumulierte bestätigte Ebola-Fälle und Todesfälle in der Demokratischen Republik Kongo, 21. Mai bis 29. Juli 2026. Fälle steigen von 83 auf 3442, Todesfälle von 9 auf 1521.">
        <ResponsiveContainer width="100%" height={300}>
          <LineChart data={DATA} margin={{ top: 8, right: 16, bottom: 4, left: -8 }}>
            <CartesianGrid stroke={grid} vertical={false} />
            <XAxis dataKey="label" tick={{ fill: axis, fontSize: 12 }} stroke={grid} />
            <YAxis tick={{ fill: axis, fontSize: 12 }} stroke={grid} width={44} />
            <Tooltip content={<ChartTip />} />
            <Line type="monotone" dataKey="faelle" name="Fälle" stroke="var(--series1)" strokeWidth={2}
              dot={{ r: 3, fill: 'var(--series1)', stroke: 'var(--series1)' }} activeDot={{ r: 5 }} isAnimationActive={false} />
            <Line type="monotone" dataKey="tote" name="Todesfälle" stroke="var(--series2)" strokeWidth={2}
              dot={{ r: 3, fill: 'var(--series2)', stroke: 'var(--series2)' }} activeDot={{ r: 5 }} isAnimationActive={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="source">
        Quelle: WHO Disease Outbreak News,{' '}
        <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON603" target="_blank" rel="noopener">DON603</a>{' '}
        &amp; <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613" target="_blank" rel="noopener">DON613</a>,{' '}
        <a href="https://www.africanews.com/2026/06/22/confirmed-ebola-cases-rise-to-1003-including-254-deaths-drc-says/" target="_blank" rel="noopener">Africanews/DRC-Gesundheitsministerium</a>,{' '}
        <a href="https://www.doctorswithoutborders.org/latest/ebola-disease-outbreak-2026-how-msf-responding" target="_blank" rel="noopener">Ärzte ohne Grenzen</a>,{' '}
        <a href="https://www.ksat.com/news/world/2026/07/30/congo-says-the-death-toll-in-fastest-growing-ebola-outbreak-has-passed-1500/" target="_blank" rel="noopener">AP/kongolesische Regierung</a> · 31. Juli 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Report height to the gallery so the surrounding iframe fits exactly.
function postHeight() {
  const h = document.documentElement.scrollHeight;
  if (window.parent !== window) window.parent.postMessage({ type: 'chart-height', height: h }, '*');
}
requestAnimationFrame(() => setTimeout(postHeight, 120));
window.addEventListener('resize', () => setTimeout(postHeight, 120));
</script>
</body>
</html>
