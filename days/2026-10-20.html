<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selbstständigkeit nimmt mit dem Alter stark zu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: transparent; font-family: system-ui, sans-serif; color: CanvasText; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p.lead { margin: 0 0 12px; line-height: 1.4; }
  p.src { font-size: 0.8rem; opacity: 0.8; margin-top: 8px; }
  p.fallback { font-size: 0.85rem; margin: 8px 0 0; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, LabelList } = Recharts;

// BFS: share of self-employed among employed persons, 2025, by age group (%)
const data = [
  { name: "15–24", v: 4.2 },
  { name: "25–39", v: 9.5 },
  { name: "40–54", v: 14.8 },
  { name: "55–64", v: 19.3 },
  { name: "über Rentenalter", v: 41.2 },
];
const C = "#2a7fb8";
const fmt = (x) => String(x).replace(".", ",") + " %";

function App() {
  return (
    <div>
      <h1>Selbstständigkeit nimmt mit dem Alter stark zu</h1>
      <p className="lead">2025 war in der Schweiz jede siebte erwerbstätige Person selbstständig (13,9 %, 681 000 von 4,886 Millionen). Bei den 15- bis 24-Jährigen sind es 4,2 %, bei Erwerbstätigen über dem Rentenalter 41,2 %.</p>
      <div role="img" aria-label="Flächendiagramm: Anteil Selbstständiger an den Erwerbstätigen 2025 nach Altersgruppe. 15 bis 24 Jahre 4,2 Prozent, 25 bis 39 9,5, 40 bis 54 14,8, 55 bis 64 19,3, über dem Rentenalter 41,2 Prozent. Durchschnitt aller Erwerbstätigen 13,9 Prozent." style={{ width: "100%", height: 340 }}>
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={data} margin={{ top: 20, right: 30, bottom: 30, left: 10 }}>
            <CartesianGrid strokeDasharray="3 3" opacity={0.3} vertical={false} />
            <XAxis dataKey="name" stroke="currentColor" padding={{ left: 20, right: 20 }}
              label={{ value: "Altersgruppe", position: "insideBottom", offset: -15, fill: "currentColor" }} />
            <YAxis domain={[0, 45]} tickFormatter={(t) => t + " %"} stroke="currentColor" />
            <ReferenceLine y={13.9} stroke="currentColor" strokeDasharray="5 4"
              label={{ value: "Alle Erwerbstätigen: 13,9 %", position: "insideTopLeft", fill: "currentColor", fontSize: 12 }} />
            <Tooltip formatter={(val) => [fmt(val), "Anteil Selbstständige"]} />
            <Area type="monotone" dataKey="v" stroke={C} strokeWidth={3} fill={C} fillOpacity={0.25}
              dot={{ r: 5, fill: C }} isAnimationActive={false}>
              <LabelList dataKey="v" position="top" formatter={fmt} fill="currentColor" offset={10} />
            </Area>
          </AreaChart>
        </ResponsiveContainer>
      </div>
      <p className="fallback">Kennzahlen 2025: Selbstständige 13,9 % der Erwerbstätigen (Männer 15,8 %, Frauen 11,9 %); 15–24 Jahre 4,2 %, 25–39 9,5 %, 40–54 14,8 %, 55–64 19,3 %, über Rentenalter 41,2 %. Als Selbstständige zählen auch Angestellte der eigenen AG oder GmbH.</p>
      <p className="src">Quelle: <a href="https://www.bfs.admin.ch/news/de/2025-0578" target="_blank" rel="noopener">Bundesamt für Statistik, Selbstständige Erwerbstätigkeit 2025</a> (Medienmitteilung vom 20. Oktober 2026, auch auf <a href="https://www.admin.ch/de/newnsb/59hcWCII11Fp" target="_blank" rel="noopener">admin.ch</a>), Stand: 20. Oktober 2026.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
