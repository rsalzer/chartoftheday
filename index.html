<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chart of the day</title>
<style>
  :root {
    --paper: #fbfbf9;
    --ink: #17160f;
    --muted: #6c6b63;
    --hair: #e3e1d7;
    --card: #ffffff;
    --accent: #a5341f;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131310;
      --ink: #f0eee4;
      --muted: #9a988d;
      --hair: #2a2924;
      --card: #1b1b16;
      --accent: #e0745c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 96px; }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding: 40px 0 14px;
    margin-bottom: 8px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px;
  }
  h1.title {
    font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 6vw, 48px);
    line-height: 1.05; margin: 0; letter-spacing: -0.01em;
  }
  .masthead p.sub {
    font-size: 15px; color: var(--muted); margin: 12px 0 0;
  }
  .count { font-variant-numeric: tabular-nums; }

  .feed { display: flex; flex-direction: column; gap: 40px; margin-top: 40px; }

  article.day {
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 14px;
    overflow: hidden;
  }
  .day-head { padding: 22px 24px 6px; }
  .day-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
  }
  .day-date { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .badge {
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 2px 10px; line-height: 1.5;
  }
  h2.day-title {
    font-family: var(--serif); font-weight: 600; font-size: clamp(22px, 3.4vw, 30px);
    line-height: 1.12; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  p.day-lead { font-size: 16px; margin: 0 0 4px; color: var(--ink); }

  .frame-wrap { padding: 6px 12px 12px; }
  iframe.chart {
    width: 100%; border: 0; display: block; background: transparent;
    border-radius: 10px; min-height: 200px;
  }

  .day-foot {
    padding: 6px 24px 20px; font-size: 12.5px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline;
  }
  .day-foot a { color: var(--muted); text-underline-offset: 2px; }
  .day-foot a:hover { color: var(--accent); }
  .src-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; }

  .state { padding: 60px 0; color: var(--muted); font-size: 15px; }
  .state code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    background: var(--card); border: 1px solid var(--hair); border-radius: 6px; padding: 1px 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Automatisierte Datengrafik &middot; täglich</p>
    <h1 class="title">Tages-Charts</h1>
    <p class="sub">Jeden Tag ein Newsereignis, recherchiert und als Grafik gebaut. Neuste zuoberst. <span class="count" id="count"></span></p>
  </header>

  <main class="feed" id="feed" aria-live="polite"></main>
  <div class="state" id="state" hidden></div>
</div>

<script>
(function () {
  var feed = document.getElementById('feed');
  var stateEl = document.getElementById('state');
  var countEl = document.getElementById('count');

  function showState(html) {
    stateEl.hidden = false;
    stateEl.innerHTML = html;
  }

  function fmtDate(iso) {
    var parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    var months = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
    var m = months[parseInt(parts[1], 10) - 1] || parts[1];
    return parseInt(parts[2], 10) + '. ' + m + ' ' + parts[0];
  }

  function hostname(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderCard(entry) {
    var art = el('article', 'day');

    var head = el('div', 'day-head');
    var meta = el('div', 'day-meta');
    meta.appendChild(el('span', 'day-date', fmtDate(entry.date)));
    if (entry.category) meta.appendChild(el('span', 'badge', entry.category));
    head.appendChild(meta);
    head.appendChild(el('h2', 'day-title', entry.title || ''));
    if (entry.lead) head.appendChild(el('p', 'day-lead', entry.lead));
    art.appendChild(head);

    var fw = el('div', 'frame-wrap');
    var iframe = document.createElement('iframe');
    iframe.className = 'chart';
    iframe.setAttribute('loading', 'lazy');
    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.setAttribute('title', entry.title || ('Chart ' + entry.date));
    iframe.style.height = '460px';
    iframe.src = entry.file;
    iframe.dataset.date = entry.date;
    fw.appendChild(iframe);
    art.appendChild(fw);

    var foot = el('div', 'day-foot');
    foot.appendChild(el('span', 'src-label', 'Quelle'));
    var urls = Array.isArray(entry.sourceUrls) ? entry.sourceUrls : [];
    urls.forEach(function (u, i) {
      var a = document.createElement('a');
      a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = hostname(u);
      foot.appendChild(a);
      if (i < urls.length - 1) foot.appendChild(document.createTextNode('·'));
    });
    art.appendChild(foot);

    return art;
  }

  // Day files report their content height via postMessage so cards fit exactly.
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.type !== 'chart-height' || typeof d.height !== 'number') return;
    var frames = feed.querySelectorAll('iframe.chart');
    for (var i = 0; i < frames.length; i++) {
      if (frames[i].contentWindow === ev.source) {
        frames[i].style.height = Math.max(200, Math.round(d.height)) + 'px';
        break;
      }
    }
  });

  fetch('manifest.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (list) {
      if (!Array.isArray(list) || list.length === 0) {
        countEl.textContent = '';
        showState('Noch keine Charts. Sobald die Routine gelaufen ist, erscheint hier der erste Tag.');
        return;
      }
      list.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      countEl.textContent = '(' + list.length + ')';
      var frag = document.createDocumentFragment();
      list.forEach(function (entry) { frag.appendChild(renderCard(entry)); });
      feed.appendChild(frag);
    })
    .catch(function (err) {
      showState('Konnte <code>manifest.json</code> nicht laden (' + err.message +
        '). Lokal bitte über einen Webserver öffnen, z. B. <code>npx serve</code>, nicht per file://.');
    });
})();
</script>
</body>
</html>
