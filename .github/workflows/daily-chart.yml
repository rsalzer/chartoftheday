name: Daily Chart of the Day

permissions:
  contents: write
  id-token: write

on:
  schedule:
    - cron: '0 5 * * *'   # 5 AM UTC daily
  workflow_dispatch:       # manual "Run workflow" button for testing

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read and fully execute the task defined in PROMPT.md."
          claude_args: "--max-turns 100 --allowedTools Edit,Read,Write,Bash,WebSearch,WebFetch"
          show_full_output: true
